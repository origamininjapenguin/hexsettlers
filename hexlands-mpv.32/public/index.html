<script id="engine">
const R=['w','b','s','h','o'],RN={w:'Wood',b:'Brick',s:'Sheep',h:'Wheat',o:'Ore'},HC={w:'#3f7a3a',b:'#b5563b',s:'#9fcf6a',h:'#e2c04a',o:'#808a96',d:'#d9c48f'};
