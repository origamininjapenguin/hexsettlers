<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hexlands</title>

<style>

@keyframes fl{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-4em)}}.fl{position:absolute;z-index:4;font-size:2em;font-weight:bold;pointer-events:none;text-shadow:0 0 .2em #000,0 .05em .1em #000;animation:fl 1.4s ease-out forwards}.fl.up{color:#7dff7d}.fl.dn{color:#ff7b7b}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}.g3 button{display:flex;flex-direction:column;align-items:center;gap:.2em;margin:0;padding:.3em .1em;font-size:.9em}.g3 small{font-size:.7em;opacity:.8}
.cs{display:flex;gap:.15em;justify-content:center;flex-wrap:wrap}.ch{display:inline-flex;align-items:center;border-radius:.3em;border:1px solid #2a1d10;font-style:normal;font-size:.8em;color:#1f160d;font-weight:bold;padding:0 .2em}.ch svg{width:1.3em;height:1.3em}

.dice{display:flex;align-items:center;justify-content:center;gap:.2em;padding:.1em;border-radius:.5em}.dice.t{background:rgba(233,196,106,.15)}.die{font-size:3.4em;line-height:1;display:inline-block;color:#fff3d6}.dt{font-size:1.6em;margin-left:.3em;color:#e9c46a}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(360deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}.die.spin{animation:tumble .9s ease-in-out}

</style></head><body><div id="app">

</defs></svg>
<div id="menu"><h1>⚔ HEXLANDS ⚔</h1><div class="sub">Settle, trade and conquer the island</div>
<div class="cols"><div class="pn"><h3>Players</h3><label>Number of players <select id="np" onchange="rows()"><option>3</option><option selected>4</option></select></label><div id="pr"></div></div>
<div class="pn"><h3>Rules</h3><label>Victory points to win: <b id="vl">10</b><br><input id="vp" type="range" min="5" max="15" value="10" oninput="$('vl').textContent=this.value"></label>
<label><input type="checkbox" id="dc" checked> Desert &amp; robber start in the center<br><small>(unchecked: random position)</small></label>
<label><input type="checkbox" id="mu" checked onchange="music(this.checked)"> Orchestral medieval music</label></div></div>
<button id="go" onclick="start()">Begin the Game</button></div>
<div id="game" hidden><div id="pl" class="pn"></div><div id="bd"><svg id="bs" viewBox="-270 -240 540 480"><g id="bg"></g><g id="rb" opacity=".88"><ellipse cy="6" rx="9" ry="13" fill="#111"/><circle cy="-11" r="6" fill="#111"/></g></svg></div><div id="sd" class="pn"></div><div id="hand" class="pn"></div></div>
<div id="md" hidden></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script id="engine">
const R=['w','b','s','h','o'],RN={w:'Wood',b:'Brick',s:'Sheep',h:'Wheat',o:'Ore'},HC={w:'#3f7a3a',b:'#b5563b',s:'#9fcf6a',h:'#e2c04a',o:'#808a96',d:'#d9c48f'};
const COST={road:{b:1,w:1},settle:{b:1,w:1,s:1,h:1},city:{h:2,o:3},dev:{s:1,h:1,o:1}},DN={kn:'Knight',vp:'Victory Point',rb:'Road Building',yp:'Year of Plenty',mo:'Monopoly'};
const $=id=>document.getElementById(id),rnd=n=>Math.random()*n|0,esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const shuf=a=>{for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const S=50,HP=[0,1,2,3,4,5].map(k=>{const a=(60*k-30)*Math.PI/180;return(S*Math.cos(a)).toFixed(1)+','+(S*Math.sin(a)).toFixed(1)}).join(' ');
let G,mus=true,AC,mg,mt,bi=0,mi_=3,vol=70;
const DC=['#d63a3a','#3a6fd6','#f08a24','#eeeeee'],DNm=['You','Sir Bot','Lady Bot','Baron Bot'];
$('pr').innerHTML=[0,1,2,3].map(i=>`<div class="row" id="r${i}"><input type="color" id="c${i}" value="${DC[i]}"><input id="n${i}" value="${DNm[i]}" maxlength="14"><select id="a${i}"><option value="0">Human</option><option value="1"${i?' selected':''}>AI Bot</option></select></div>`).join('');
function rows(){[0,1,2,3].forEach(i=>$('r'+i).hidden=i>=+$('np').value)}rows();
/* ---------- music ---------- */
const prog=[[50,57,62,65],[48,55,60,64],[46,53,58,62],[45,52,57,60]],scale=[62,64,65,67,69,71,72,74,76];
function note(m,t,d,ty,v,at){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type=ty;o.frequency.value=440*2**((m-69)/12);f.type='lowpass';f.frequency.value=ty=='sawtooth'?800:2400;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.linearRampToValueAtTime(0,t+d);o.connect(f);f.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.1)}
function drum(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.4);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.8)}
function bar(){const t=AC.currentTime+.05,c=prog[bi++%4];c.forEach(m=>note(m,t,3.4,'sawtooth',.05,1.2));note(c[0]-12,t,3.4,'sawtooth',.09,1);drum(t);drum(t+1.6);
for(let i=0;i<8;i++)if(i%2==0||Math.random()<.5){mi_=Math.max(0,Math.min(8,mi_+rnd(3)-1));note(scale[mi_],t+i*.4,.9,'triangle',.11,.05)}mt=setTimeout(bar,3200)}
function music(on){mus=on;$('mu').checked=on;if(!on){clearTimeout(mt);mt=0;if(mg)mg.gain.setTargetAtTime(0,AC.currentTime,.2);return}
if(!AC){AC=new AudioContext();mg=AC.createGain();const d=AC.createDelay(),f=AC.createGain();d.delayTime.value=.42;f.gain.value=.45;d.connect(f);f.connect(d);mg.connect(d);d.connect(AC.destination);mg.connect(AC.destination)}
AC.resume();mg.gain.setTargetAtTime(vol/100*.8,AC.currentTime,.4);if(!mt)bar()}
/* ---------- board ---------- */
function build(center){const H=[],V=[],E=[],vm={},em={},pos=[];
for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(Math.abs(q+r)<=2)pos.push([q,r]);
const t=shuf([...'wwwwssssshhhhbbbooo'.replace('sssss','ssss')]),nums=shuf([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);
t.splice(center?pos.findIndex(p=>!p[0]&&!p[1]):rnd(19),0,'d');
pos.forEach(([q,r],i)=>{const x=S*Math.sqrt(3)*(q+r/2),y=S*1.5*r,h={x,y,t:t[i],n:t[i]=='d'?0:nums.pop(),v:[]};
for(let k=0;k<6;k++){const a=(60*k-30)*Math.PI/180,px=x+S*Math.cos(a),py=y+S*Math.sin(a),key=Math.round(px)+','+Math.round(py);
if(!(key in vm)){vm[key]=V.length;V.push({id:V.length,x:px,y:py,hx:[],nb:[],ed:[],b:null,port:null})}h.v.push(vm[key]);V[vm[key]].hx.push(H.length)}H.push(h)});
H.forEach(h=>h.v.forEach((a,k)=>{const b=h.v[(k+1)%6],key=Math.min(a,b)+'-'+Math.max(a,b);
if(!(key in em)){em[key]=E.length;E.push({id:E.length,a,b,o:null,n:0});V[a].nb.push(b);V[b].nb.push(a);V[a].ed.push(E.length-1);V[b].ed.push(E.length-1)}E[em[key]].n++}));
const co=E.filter(e=>e.n==1).sort((p,q)=>Math.atan2(V[p.a].y+V[p.b].y,V[p.a].x+V[p.b].x)-Math.atan2(V[q.a].y+V[q.b].y,V[q.a].x+V[q.b].x)),pt=shuf(['3','3','3','3','w','b','s','h','o']),ports=[];let ix=0;
[3,3,4,3,3,4,3,3,4].forEach((g,i)=>{const e=co[ix];ix+=g;const mx=(V[e.a].x+V[e.b].x)/2,my=(V[e.a].y+V[e.b].y)/2,hh=H[V[e.a].hx.find(h=>V[e.b].hx.includes(h))],dx=mx-hh.x,dy=my-hh.y,l=Math.hypot(dx,dy);
V[e.a].port=V[e.b].port=pt[i];ports.push({e,t:pt[i],x:mx+dx/l*32,y:my+dy/l*32})});
return{H,V,E,ports}}
/* ---------- rules ---------- */
const cur=()=>G.P[G.t],cards=i=>R.reduce((a,r)=>a+G.P[i].res[r],0),can=(p,c)=>R.every(r=>p.res[r]>=(c[r]||0)),pay=(p,c)=>R.forEach(r=>{p.res[r]-=c[r]||0;G.bank[r]+=c[r]||0});
const log=s=>{G.log.unshift(s);G.log.length=Math.min(G.log.length,30)},pips=n=>n?6-Math.abs(7-n):0;
const score=(i,all)=>{const p=G.P[i];return(5-p.st)+2*(4-p.ci)+(G.lh==i?2:0)+(G.la==i?2:0)+(all?p.vpc:0)};
const vval=v=>G.V[v].hx.reduce((a,h)=>a+pips(G.H[h].n),0)+(G.V[v].port?2:0)+new Set(G.V[v].hx.map(h=>G.H[h].t)).size;
const rt=(pi,r)=>G.V.some(v=>v.b&&v.b.o==pi&&v.port==r)?2:G.V.some(v=>v.b&&v.b.o==pi&&v.port=='3')?3:4;
function vOK(pi,v,setup){const x=G.V[v];if(G.P[pi].st<1||x.b||x.nb.some(n=>G.V[n].b))return false;return setup||x.ed.some(e=>G.E[e].o===pi)}
function eOK(pi,e){const E=G.E[e];if(E.o!=null||G.P[pi].rd<1)return false;if(G.mode=='setupR')return E.a==G.last||E.b==G.last;
return[E.a,E.b].some(v=>{const b=G.V[v].b;return b?b.o==pi:G.V[v].ed.some(x=>G.E[x].o===pi)})}
const anyRoad=pi=>G.E.some(e=>eOK(pi,e.id));
function lroad(pi){let best=0;const dfs=(v,u)=>{let m=u.size;for(const e of G.V[v].ed){const ed=G.E[e];if(ed.o!==pi||u.has(e))continue;const w=ed.a==v?ed.b:ed.a;u.add(e);const bl=G.V[w].b&&G.V[w].b.o!==pi;m=Math.max(m,bl?u.size:dfs(w,u));u.delete(e)}return m};
G.V.forEach(v=>best=Math.max(best,dfs(v.id,new Set())));return best}
function awards(){G.P.forEach((p,i)=>p.lr=lroad(i));let h=G.lh;if(h!=null&&G.P[h].lr<5)h=null;let mx=h==null?4:G.P[h].lr;G.P.forEach((p,i)=>{if(p.lr>mx){mx=p.lr;h=i}});G.lh=h;
let a=G.la;G.P.forEach((p,i)=>{if(p.kn>=3&&p.kn>(a==null?2:G.P[a].kn))a=i});G.la=a}
const mark=k=>G.pl[k]=Date.now(),age=k=>Date.now()-(G.pl[k]||0),pa=k=>{const e=age(k);return e<450?` style="animation:pop .45s cubic-bezier(.3,1.6,.5,1) ${-e}ms both;transform-box:fill-box;transform-origin:center"`:''},pr=k=>{const e=age(k);return e<450?` pathLength="1" style="stroke-dasharray:1;animation:draw .4s ease-out ${-e}ms both"`:''};
function setS(pi,v,setup){const p=G.P[pi];G.V[v].b={o:pi,c:0};mark('v'+v);sfx('settle');p.st--;if(setup){G.last=v;G.mode='setupR';if(G.si>=G.P.length)G.V[v].hx.forEach(h=>{const t=G.H[h].t;if(t!='d'&&G.bank[t]>0){p.res[t]++;G.bank[t]--}})}else G.mode='main'}
function setR(pi,e){G.E[e].o=pi;mark('e'+e);sfx('road');G.P[pi].rd--;
if(G.mode=='setupR'){const i=++G.si;if(i>=G.order.length){G.t=0;G.mode='roll'}else{G.t=G.order[i];G.mode='setupS'}}
else{if(G.free>0)G.free--;if(G.free>0&&anyRoad(pi))G.mode='road';else{G.free=0;G.mode=G.ret||'main';G.ret=0}}}
const F='⚀⚁⚂⚃⚄⚅';
function roll(){if(G.rolling||G.mode!='roll'||G.over)return;G.rolling=1;sfx('dice');const a=rnd(6)+1,b=rnd(6)+1,ds=document.querySelectorAll('.die');ds.forEach(e=>e.classList.add('spin'));let n=0;const iv=setInterval(()=>{ds.forEach(e=>e.textContent=F[rnd(6)]);if(++n>9){clearInterval(iv);G.rolling=0;G.d=[a,b];applyRoll(a+b)}},90)}
function applyRoll(d){G.dice=d;G.land=1;log(`${cur().name} rolled ${d}`);
if(d==7){G.dq=[];G.P.forEach(p=>{const n=R.reduce((a,r)=>a+p.res[r],0);if(n>7&&!p.ai)G.dq.push(G.P.indexOf(p));else if(n>7){const k=n>>1;for(let i=0;i<k;i++){const rs=R.filter(r=>p.res[r]);const x=rs[rnd(rs.length)];p.res[x]--;G.bank[x]++}log(`${p.name} discards ${k} cards`)}});G.mode='robber';G.ret='main';if(G.dq.length){G.pending=1;discard(G.dq.shift())}}
else{const dm={};R.forEach(r=>dm[r]={});G.H.forEach((h,i)=>{if(h.n==d&&i!=G.rob)h.v.forEach(v=>{const b=G.V[v].b;if(b)dm[h.t][b.o]=(dm[h.t][b.o]||0)+(b.c?2:1)})});R.forEach(r=>{const o=Object.entries(dm[r]),tot=o.reduce((a,x)=>a+x[1],0);if(!tot)return;if(tot<=G.bank[r])o.forEach(([i,n])=>{G.P[i].res[r]+=n;G.bank[r]-=n});else if(o.length==1){G.P[o[0][0]].res[r]+=G.bank[r];G.bank[r]=0}else log(`Bank is short on ${RN[r]}: nobody collects`)});G.mode='main'}render()}
function moveRob(h){G.rob=h;sfx('robber');const vs=[...new Set(G.H[h].v.map(v=>G.V[v].b).filter(b=>b&&b.o!=G.t&&cards(b.o)>0).map(b=>b.o))];
if(vs.length){const q=G.P[vs[rnd(vs.length)]],rs=R.filter(r=>q.res[r]>0),r=rs[rnd(rs.length)];q.res[r]--;cur().res[r]++;log(`${cur().name} stole a card from ${q.name}`)}
else log(`${cur().name} moved the robber`);G.mode=G.ret||'main';G.ret=0}
function act(k,id){const pi=G.t,p=G.P[pi],m=G.mode;
if(m=='setupS'&&k=='v'&&vOK(pi,id,1))setS(pi,id,1);
else if(m=='setupR'&&k=='e'&&eOK(pi,id))setR(pi,id);
else if(m=='road'&&k=='e'&&eOK(pi,id)){if(!G.free)pay(p,COST.road);setR(pi,id)}
else if(m=='settle'&&k=='v'&&vOK(pi,id,0)){pay(p,COST.settle);setS(pi,id,0)}
else if(m=='city'&&k=='v'){const b=G.V[id].b;if(b&&b.o==pi&&!b.c){pay(p,COST.city);b.c=1;mark('v'+id);sfx('city');p.ci--;p.st++;G.mode='main'}else return}
else if(m=='robber'&&k=='h'&&id!=G.rob)moveRob(id);else return;render()}

/* Multiplayer client layer: the game script above still does all rendering, music and sound;
   here every game action is sent to the server and the board is redrawn from its snapshots. */
(()=>{
let ws,lobby,geo,spinT;
const send=window.send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
$('menu').hidden=1;
const L=document.createElement('div');L.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:radial-gradient(#3b2a1a,#17100a);z-index:3;text-align:center';$('app').appendChild(L);
const TO=(id,v,c)=>`<select id="${id}" onchange="mpCfg()">${v.map(x=>`<option value="${x}"${x==c?' selected':''}>${x?x+'s':'Off'}</option>`).join('')}</select>`;
function lob(){
if(!lobby){L.innerHTML=`<h1 style="font-size:3em;letter-spacing:.12em;color:#e9c46a">\u2694 HEXLANDS ONLINE \u2694</h1><div class="pn"><p>Your name <input id="ln" value="${esc(sessionStorage.nm||'')}" maxlength="14"></p><p><button onclick="mpCreate()">Create room</button></p><p>Room code <input id="lc" maxlength="4" style="width:5em;text-transform:uppercase"> <button onclick="mpJoin()">Join</button></p><p id="le"></p></div><div class="pn" style="min-width:30em"><b>Public rooms</b> <input id="lq" placeholder="search host or code" oninput="mpList()" style="width:12em"><div id="lr" style="margin-top:.4em;font-size:.9em">Loading\u2026</div></div>`;mpList();return}
const you=lobby.you,host=you==0;
L.innerHTML=`<h2>Room <b style="letter-spacing:.2em;color:#e9c46a">${lobby.code}</b> \u2014 share this code with friends</h2><div class="pn">${lobby.seats.map((s,i)=>`<div class="row"><input type="color" id="lcol${i}" value="${s.color}" ${i==you?'':'disabled'} onchange="mpMe()">${i==you?`<input id="lnm" value="${esc(s.name)}" maxlength="14" onchange="mpMe()">`:`<span style="width:11em;text-align:left">${esc(s.name)}</span>`}${host&&i&&s.k!='human'?`<select id="ls${i}" onchange="mpCfg()">${['open','bot','closed'].map(k=>`<option${k==s.k?' selected':''}>${k}</option>`).join('')}</select>`:`<span>${s.k}${s.k=='human'&&!s.on?' (offline)':''}</span>`}</div>`).join('')}</div>`+
(host?`<div class="pn">Victory points: <b id="lvl">${lobby.vp}</b> <input id="lvp" type="range" min="5" max="15" value="${lobby.vp}" oninput="$('lvl').textContent=this.value" onchange="mpCfg()"> <label><input type="checkbox" id="ldc" ${lobby.dc?'checked':''} onchange="mpCfg()"> Desert in the center</label><br><label><input type="checkbox" id="lpub" ${lobby.pub?'checked':''} onchange="mpCfg()"> Public room (listed in search)</label><br>Dice / quick-action timer ${TO('lrt',[0,15,30,45,60],lobby.rt)} Turn timer ${TO('ltt',[0,60,90,120,180,300],lobby.tt)}</div><button id="go" onclick="send({t:'start'})">Start game</button>`:'<p>Waiting for the host to start\u2026</p><p style="font-size:.9em">'+(lobby.pub?'Public':'Private')+' room \u00b7 dice timer '+(lobby.rt||'off')+'s \u00b7 turn timer '+(lobby.tt||'off')+'s</p>')+'<p id="le"></p>'}
window.mpCreate=()=>{sessionStorage.nm=$('ln').value;send({t:'create',name:$('ln').value})};
window.mpJoin=()=>{sessionStorage.nm=$('ln').value;send({t:'join',code:$('lc').value,name:$('ln').value})};
window.mpMe=()=>send({t:'me',name:$('lnm').value,color:$('lcol'+lobby.you).value});
window.mpCfg=()=>send({t:'cfg',seats:[1,2,3].map(i=>$('ls'+i)?$('ls'+i).value:null),vp:+$('lvp').value,dc:$('ldc').checked,pub:$('lpub').checked,rt:+$('lrt').value,tt:+$('ltt').value});
window.mpList=()=>send({t:'list',q:($('lq')||{}).value||''});
window.mpJoinCode=c=>{sessionStorage.nm=$('ln').value;send({t:'join',code:c,name:$('ln').value})};
setInterval(()=>{if(!lobby&&!geo)mpList()},4000);
const TB=document.createElement('div');TB.style.cssText='position:absolute;top:.5em;left:50%;transform:translateX(-50%);z-index:2;padding:.2em .8em;border-radius:.6em;background:rgba(0,0,0,.6);border:1px solid #c9a15a;font-size:1.1em;display:none';$('app').appendChild(TB);
let dl=0,who='';setInterval(()=>{const l=Math.ceil((dl-Date.now())/1000);if(!dl||!G||!G.init){TB.style.display='none';return}TB.style.display='block';TB.style.color=l<=10?'#ff7b7b':'#f1e4c3';TB.textContent='\u23f1 '+who+': '+Math.max(0,l)+'s'},250);
/* game actions now go to the server */
roll=()=>send({t:'roll'});act=(k,id)=>send({t:'act',k,id});bld=k=>send({t:'bld',k});buyDev=()=>send({t:'buyDev'});endTurn=()=>send({t:'end'});playDev=c=>send({t:'play',c});
bank=()=>send({t:'bank',g:G.tb.g,r:G.tb.r});offer=()=>{send({t:'offer',g:G.tb.g,r:G.tb.r});closeM()};
dcDone=()=>{send({t:'discard',s:G.dc.s});closeM()};aiAct=()=>{};menu=()=>{sessionStorage.removeItem('mp');location.reload()};
function spin(on){clearInterval(spinT);if(on){sfx('dice');document.querySelectorAll('.die').forEach(e=>e.classList.add('spin'));spinT=setInterval(()=>document.querySelectorAll('.die').forEach(e=>e.textContent=F[rnd(6)]),90)}}
function begin(me){L.hidden=true;$('game').hidden=0;G={...geo,P:[],pl:{},log:[],bank:{},deck:[],view:me,mode:'',me,over:0,init:0};G.V.forEach(v=>v.b=null);G.E.forEach(e=>e.o=null);
music(true);sfxInit();addEventListener('pointerdown',()=>{music(true);sfxInit()},{once:true})}
function apply(s){const q=G.init;if(s.rolling!=!!G.rolling)spin(s.rolling);
s.V.forEach((b,i)=>{const v=G.V[i];if(b&&(!v.b||v.b.c!=b.c)){G.pl['v'+i]=Date.now();if(q)sfx(b.c?'city':'settle')}v.b=b});
s.E.forEach((o,i)=>{const e=G.E[i];if(o!=null&&e.o==null){G.pl['e'+i]=Date.now();if(q)sfx('road')}e.o=o});
if(q&&s.rob!=G.rob)sfx('robber');if(q&&s.deck<G.deck.length)sfx('dev');if(s.dice&&s.dice!=G.dice)G.land=1;
const tn=q?G.tn:(s.tmsg?s.tmsg.n:0);
Object.assign(G,{t:s.t,mode:s.mode,vp:s.vp,dice:s.dice,d:s.d,rolling:s.rolling,rob:s.rob,over:s.over,last:s.last,free:s.free,bank:s.bank,lh:s.lh,la:s.la,devPlayed:s.devPlayed,log:s.log,of:s.of,view:s.me,deck:Array(s.deck),init:1,tn:s.tmsg?s.tmsg.n:tn});
G.P=s.P.map((p,i)=>i==s.me?{...p,ai:false}:{...p,ai:true,vpc:0,res:{w:p.nc,b:0,s:0,h:0,o:0},dev:Array(p.ndc).fill('?'),nd:[]});
render();
if(s.tmsg&&s.tmsg.i==s.me&&s.tmsg.n>tn){if(s.tmsg.m=='Traded with the bank.')G.tb={g:{},r:{}};if(/^Invalid counter/.test(s.tmsg.m))cbUI(s.tmsg.m);else tUI(s.tmsg.m)}
if(s.win>=0){if(!G.won){G.won=1;modal(`<h3>\ud83c\udfc6 ${esc(G.P[s.win].name)} wins!</h3><button onclick="menu()">Back to lobby</button>`)}return}
G.ls=s;prompts(s)}
function prompts(s){const u=s.mu,mine=u&&u.i==s.me;
if(!mine){if(G.mm){G.mm=0;closeM()}return}
if(G.mm)return;G.mm=1;const p=G.P[s.t],nm=esc(G.P[s.me].name),b=(v,t)=>`<button onclick="send({t:'ans',v:${v}})">${t}</button>`;
if(u.k=='ask')modal(`<h3>${nm}</h3><p>${esc(p.name)} offers ${txt(s.of.g)} for your ${txt(s.of.r)}.</p>${b(1,'Accept')} <button onclick="mpCtr()">Counter</button> ${b(0,'Decline')}`);
else if(u.k=='ctr')modal(`<h3>${nm}</h3><p>A bot counters: you give ${txt(u.c.g)}; you get ${txt(u.c.r)}.</p>${b(1,'Accept')} ${b(0,'Decline')}`);
else if(u.k=='cx')modal(`<h3>${nm}</h3><p>${esc(G.P[u.q].name)} counters: they give ${txt(u.c.g)} for your ${txt(u.c.r)}.</p>${b(1,'Accept')} ${b(0,'Decline')}`);
else if(u.k=='dc'){G.dc={i:s.me,k:s.dc.k,s:{w:0,b:0,s:0,h:0,o:0}};dcUI()}
else if(u.k=='pk')pick(u.t,u.n,l=>l.forEach(r=>send({t:'pick',r})))}
window.prompts=prompts;
window.mpCtr=()=>{G.cb={g:{...G.ls.of.r},r:{...G.ls.of.g}};cbUI()};
window.cbUI=m=>modal(`<h3>Counter offer</h3><p>You give</p>${rowH('cb','g','cbAdj')}<p>You get</p>${rowH('cb','r','cbAdj')}<p>${m||''}</p><button onclick="send({t:'counter',g:G.cb.g,r:G.cb.r})">Send counter</button> <button onclick="G.mm=0;prompts(G.ls)">Back</button>`);
window.cbAdj=(k,x,d)=>{const b=G.cb[k];b[x]=Math.max(0,Math.min(19,(b[x]||0)+d));if(k=='g'&&b[x]>G.P[G.me].res[x])b[x]=G.P[G.me].res[x];cbUI()};
function on(m){
if(m.t=='joined')sessionStorage.mp=JSON.stringify({code:m.code,token:m.token});
else if(m.t=='lobby'){lobby=m;if(!geo)lob()}
else if(m.t=='err'){if(m.m=='gone')sessionStorage.removeItem('mp');else if($('le'))$('le').textContent=m.m}
else if(m.t=='rooms'){const e=$('lr');if(e)e.innerHTML=m.rooms.length?m.rooms.map(r=>`<div class="row"><b>${esc(r.host)}</b> \u00b7 ${r.code} \u00b7 ${r.humans} playing, ${r.open} open \u00b7 ${r.vp} VP <button onclick="mpJoinCode('${r.code}')">Join</button></div>`).join(''):'No public rooms found.'}
else if(m.t=='tm'){dl=m.i>=0&&m.lim?Date.now()+m.left*1000:0;who=G&&G.P&&G.P[m.i]?G.P[m.i].name:''}
else if(m.t=='start'){geo=m.geo;begin(m.me)}
else if(m.t=='state')apply(m.s)}
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>{const r=JSON.parse(sessionStorage.mp||'null');if(r)send({t:'resume',...r});mpList()};
ws.onmessage=e=>on(JSON.parse(e.data));ws.onclose=()=>setTimeout(conn,1500)}
lob();conn();
})();
